<!DOCTYPE html>
<html>
<head>
<style>
/* Base body background */
body {
  background-image: url('gif.gif');
  background-repeat: repeat-y;
  background-attachment: fixed;
  background-size: 100% 100%;
  margin: 0;
  text-align: center;
  overflow-x: hidden;
  z-index: 0;
}

/* Top Navigation Bar */
nav {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 60px;
  backdrop-filter: blur(10px);
  background: rgba(0, 0, 0, 0.4); 
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 40px;
  z-index: 5; /* above parallax + content */
  font-family: sans-serif;
}

nav a {
  color: white;
  font-size: 1rem;
  text-decoration: none;
  padding: 8px 12px;
}

nav a:hover {
  color: rgb(255, 0, 251);
  text-decoration: underline;
}

/* Parallax overlay that loops vertically */
.parallax-layer {
  position: fixed;
  inset: 0;
  background-image: url('IMG_1805.PNG');
  background-repeat: repeat-y;
  background-size: cover;
  background-position: center 0;
  z-index: 1;
  pointer-events: none;
}

/* Main content */
.page-wrapper {
  width: 80%;
  margin: 0 auto;
  text-align: center;
  line-height: 1;
  position: relative;
  z-index: 2;
  color: white;
}

header {
  padding-top: 150px;
}

p {
  font-family: sans-serif;
}

footer {
  position: fixed;
  bottom: 10px;
  left: 0;
  width: 100%;
  text-align: center;
  color: rgba(255, 255, 255, 0.6);
  font-size: 0.8rem;
  font-family: sans-serif;
  pointer-events: none;
  z-index: 3;
}

/* Link styling */
a:link {
  color: rgb(5, 142, 91);
  background-color: transparent;
  text-decoration: none;
}
a:visited {
  color: pink;
  background-color: transparent;
  text-decoration: none;
}
a:hover {
  color: rgb(255, 0, 251);
  background-color: transparent;
  text-decoration: underline;
}
</style>
</head>

<body>

<!-- 🌟 OVERHEAD NAVIGATION MENU -->
<nav>
  <a href="index.html">Home</a>
  <a href="Links.html">Listen</a>
  <a href="About.html">About</a>
  <a href="Contact.html">Contact</a>
</nav>

<!-- Parallax layer -->
<div class="parallax-layer" id="parallax"></div>

<div class="page-wrapper">
  <br>
  <br>
  <br>
  <br>
  <img src="IMG_1803.PNG" alt="Teya Weir" width="200"/> 

  <br>
    <iframe style="border: 0; width: 394px; height: 830px;" src="https://bandcamp.com/EmbeddedPlayer/album=3591349869/size=large/bgcol=333333/linkcol=e32c14/transparent=true/" seamless><a href="https://teyaweir.bandcamp.com/album/silence-is-how-ill-love-you">(silence is how i&#39;ll love you) by Teya Weir</a></iframe>
  <br>
  <br>
  <br>
  <br>
  <br>
  <br>
  <br>
  <br>
  <br>

</div>

<script>
const layer = document.getElementById('parallax');
const SPEED = 0.4;

window.addEventListener('scroll', () => {
  const y = window.scrollY * SPEED;
  layer.style.backgroundPosition = `center ${-y}px`;
});
</script>



<footer>
  <p>© 2025 Teya Weir</p>
  <br>
  <p></p>
</footer>

</body>
</html>
